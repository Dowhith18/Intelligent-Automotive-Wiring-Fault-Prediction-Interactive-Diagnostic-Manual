name: iawfpidm
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy=1.23.5
  - pandas=1.5.3
  - matplotlib=3.7.1
  - flask=3.1.2
  - beautifulsoup4=4.14.2
  - werkzeug=3.1.3
  - jinja2=3.1.6
  - pip:
    - typing_extensions==4.15.0

# Notes:
# Use this environment file on Windows to avoid building numpy/pandas from source.
# Create it with:
# conda env create -f environment-windows.yml
# conda activate iawfpidm